name: PPX

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ppx_linux:
    strategy:
      matrix:
        include:
          - platform: ubuntu-24.04-arm
            artifact: ppx-linux-arm64
            debian_arch: arm64
          - platform: ubuntu-latest
            artifact: ppx-linux
            debian_arch: amd64

    name: PPX Linux
    runs-on: ${{ matrix.platform }}
    container:
      image: debian:bullseye
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            ca-certificates \
            git \
            gnupg \
            file \
            m4 \
            musl-tools \
            rsync \
            unzip \
            bubblewrap
      - uses: actions/checkout@v4
      - name: Trust the mounted workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify build architecture
        run: test "$(dpkg --print-architecture)" = "${{ matrix.debian_arch }}"
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "ocaml-variants.5.0.0+options,ocaml-option-musl,ocaml-option-static"
          dune-cache: true
          cache-prefix: "v3-ocaml5-musl-bullseye"
      - name: Install dependencies
        run: opam install . --deps-only
      - name: Build PPX
        run: |
          opam exec -- dune build --profile release-static bin/RescriptEmbedLang.exe
          opam exec -- dune build @runtest
          cp _build/default/bin/RescriptEmbedLang.exe ${{ matrix.artifact }}
      - name: Verify PPX binary
        run: |
          file ${{ matrix.artifact }}
          file ${{ matrix.artifact }} | grep -q "statically linked"
          ./${{ matrix.artifact }} --help > /dev/null 2>&1
      - name: Strip binary
        run: |
          chmod +w ${{ matrix.artifact }}
          strip ${{ matrix.artifact }}
      - name: Upload PPX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
  ppx_compat:
    name: PPX source compatibility (OCaml 4.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"
          dune-cache: true
          cache-prefix: "v1-compat"
      - name: Install dependencies
        run: opam install . --deps-only
      - name: Build PPX
        run: opam exec -- dune build @runtest bin/RescriptEmbedLang.exe

  ppx:
    strategy:
      matrix:
        include:
          - platform: macos-15-intel
            artifact: ppx-macos-latest
          - platform: macos-15
            artifact: ppx-macos-arm64
          - platform: windows-latest
            artifact: ppx-windows-latest

    name: PPX
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
        env:
          CI: true
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.0"
          dune-cache: true
          cache-prefix: "v2-ocaml5"
      - name: Install dependencies
        run: opam install . --deps-only
      - name: Build PPX
        run: opam exec -- dune build @runtest bin/RescriptEmbedLang.exe
      - name: Strip PPX binary
        if: runner.os != 'Windows'
        run: |
          chmod +w _build/default/bin/RescriptEmbedLang.exe
          strip _build/default/bin/RescriptEmbedLang.exe
      - name: Install sample project
        working-directory: test
        run: npm ci
      - name: Prepare sample PPX
        working-directory: test
        run: npm run prepare-ppx
      - name: Build sample project
        working-directory: test
        run: npx rescript
      - name: Test named generation API
        working-directory: test
        run: npm run test:named
      - name: Upload PPX artifact ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: _build/default/bin/RescriptEmbedLang.exe
          if-no-files-found: error
