name: PPX

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ppx_linux:
    name: PPX Linux
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            ca-certificates \
            git \
            gnupg \
            rsync \
            unzip \
            bubblewrap
      - uses: actions/checkout@v4
      - name: Trust the mounted workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"
          dune-cache: true
          cache-prefix: "v1-bullseye"
      - name: Install dependencies
        run: opam install . --deps-only
      - name: Build PPX
        run: |
          opam exec -- dune build --profile release-static bin/RescriptEmbedLang.exe
          cp _build/default/bin/RescriptEmbedLang.exe ppx-linux
      - name: Strip binary
        run: |
          chmod +w ppx-linux
          strip ppx-linux
      - name: Upload PPX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppx-linux
          path: ppx-*
          if-no-files-found: error
  ppx:
    strategy:
      matrix:
        include:
          - platform: macos-15-intel
            artifact: ppx-macos-latest
          - platform: macos-15
            artifact: ppx-macos-arm64
          - platform: windows-latest
            artifact: ppx-windows-latest

    name: PPX
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
        env:
          CI: true
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"
          dune-cache: true
          cache-prefix: "v1"
      - name: Install dependencies
        run: opam install . --deps-only
      - name: Build PPX
        run: opam exec -- dune build bin/RescriptEmbedLang.exe
      - name: Strip PPX binary
        if: runner.os != 'Windows'
        run: |
          chmod +w _build/default/bin/RescriptEmbedLang.exe
          strip _build/default/bin/RescriptEmbedLang.exe
      - name: Install sample project
        working-directory: test
        run: npm ci
      - name: Prepare sample PPX
        working-directory: test
        run: npm run prepare-ppx
      - name: Build sample project
        working-directory: test
        run: npx rescript
      - name: Upload PPX artifact ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: _build/default/bin/RescriptEmbedLang.exe
          if-no-files-found: error
