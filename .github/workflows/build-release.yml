name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional tag name"
        required: false

jobs:
  build-ppx-linux:
    name: Build PPX for release
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            ca-certificates \
            git \
            gnupg \
            rsync \
            unzip \
            bubblewrap
      - uses: actions/checkout@v7
      - name: Trust the mounted workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.0"
          dune-cache: true
          cache-prefix: "v2-ocaml5-bullseye"
      - name: Install PPX dependencies
        run: opam install . --deps-only
      - name: Build PPX
        run: |
          opam exec -- dune build --profile release-static bin/RescriptEmbedLang.exe
          cp _build/default/bin/RescriptEmbedLang.exe ppx-linux
      - name: Strip binary
        run: |
          chmod +w ppx-linux
          strip ppx-linux
      - name: Upload PPX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ppx-linux
          path: ppx-*
          if-no-files-found: error

  build-ppx:
    strategy:
      matrix:
        include:
          - platform: macos-15-intel
            artifact: ppx-macos-latest
          - platform: macos-15
            artifact: ppx-macos-arm64
          - platform: windows-latest
            artifact: ppx-windows-latest

    name: Build PPX for release
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.0"
          dune-cache: true
          cache-prefix: "v2-ocaml5"
      - name: Install PPX dependencies
        run: opam install . --deps-only
      - name: Build PPX
        run: opam exec -- dune build bin/RescriptEmbedLang.exe
      - name: Strip PPX binary
        if: runner.os != 'Windows'
        run: |
          chmod +w _build/default/bin/RescriptEmbedLang.exe
          strip _build/default/bin/RescriptEmbedLang.exe
      - name: Copy built PPX file
        run: |
          cp _build/default/bin/RescriptEmbedLang.exe ${{ matrix.artifact }}
      - name: Upload PPX artifact ${{ matrix.platform }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build-release:
    name: Build release package
    runs-on: ubuntu-latest
    needs: [build-ppx, build-ppx-linux]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
        env:
          CI: true
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1
      - name: Install
        run: npm ci
      - name: Build res
        run: npm run build
      - name: Build assets
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          ./build-release.sh

      - uses: actions/download-artifact@v8
        with:
          name: ppx-linux
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: ppx-macos-latest
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: ppx-macos-arm64
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: ppx-windows-latest
          path: release

      - name: Remove artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            ppx-linux
            ppx-macos-latest
            ppx-macos-arm64
            ppx-windows-latest
      - name: Upload built folder
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: release/
      - name: Publish with the requested npm tag
        if: ${{ github.event.inputs.tag_name }}
        working-directory: release
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: npm publish --tag "$INPUT_TAG_NAME"
      - name: Publish as latest
        if: ${{ !github.event.inputs.tag_name }}
        working-directory: release
        run: npm publish
